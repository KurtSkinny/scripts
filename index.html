<!DOCTYPE html><!--# set var="domain" value="YOUR_DOMAIN_NAME" -->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!--# echo var="domain" --></title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Courier New", Verdana, Arial, Helvetica;
            transition: background-color 0.3s ease, color 0.3s ease;
            will-change: transform;
            
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            margin: 0;
            user-select: none;
            transform: translateY(-6vh);
        }

        .info {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: 400;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            white-space: nowrap;
            user-select: text;
            transition: color 0.3s ease;
        }

        @media (prefers-color-scheme: light) {
            body {
                background-color: #ffffff;
                color: #111111;
            }
            .info {
            	color: #999999;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #233140;
                color: #f3f4f6;
            }
            .info {
            	color: #5f6978;
            }
        }
    </style>
</head>
<body>
    <h1><!--# echo var="domain" --></h1>
    <div class="info">
        <!--# set var="sep" value=" · " --><!--# echo var="date_gmt" --><!--# echo var="sep" --><!--# echo var="remote_addr" -->
    </div>
</body>
</html>
